AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Blyp API — health + auth + wallet + webhooks PawaPay

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Nom du stage HTTP API (dev / staging / prod)

  JwtSecret:
    Type: String
    NoEcho: true
    Default: dev-insecure-change-me
    Description: Secret HS256 pour les JWT (Secrets Manager en prod cible)

  OtpPepper:
    Type: String
    NoEcho: true
    Default: pepper
    Description: Pepper pour hash OTP

  TransactionPinPepper:
    Type: String
    NoEcho: true
    Default: ""
    Description: Pepper PIN transaction (vide = même valeur que OtpPepper)

  PayReceiptEd25519PrivateKeyPem:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Seed PEM (local samconfig uniquement). Synchronisé vers Secrets Manager au deploy ;
      la Lambda lit PAY_RECEIPT_ED25519_SECRET_ARN, pas cette variable.

  SmsProvider:
    Type: String
    Default: ""
    Description: obitsms | africastalking | webhook (optionnel)

  ObitSmsKeyApi:
    Type: String
    NoEcho: true
    Default: ""

  ObitSmsSender:
    Type: String
    Default: ""

  AndroidSmsOtpAppHash:
    Type: String
    Default: ""
    Description: Hash SMS Retriever Android (11 car.)

  WhatsappCloudToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Jeton permanent Meta WhatsApp Cloud API

  WhatsappPhoneNumberId:
    Type: String
    Default: ""
    Description: Phone number ID (Meta Business)

  WhatsappOtpTemplateName:
    Type: String
    Default: "blyp_otp"
    Description: Nom du template authentication Meta

  WhatsappOtpTemplateLang:
    Type: String
    Default: "fr"

  BlypInviteUrl:
    Type: String
    Default: "https://blyppay.com/download/blyp-pay.apk"
    Description: Lien téléchargement APK / stores dans les SMS d’invitation messages

  DepositMode:
    Type: String
    Default: sync
    AllowedValues:
      - sync
      - async
    Description: sync = crédit interne immédiat ; async = PawaPay Mobile Money

  PawapayApiToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: Jeton API PawaPay (sandbox ou live)

  PawapayApiBaseUrl:
    Type: String
    Default: "https://api.sandbox.pawapay.io"
    Description: "Sandbox = https://api.sandbox.pawapay.io — Live MoMo = https://api.pawapay.io"

  PawapayWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""

  WalletProvisionedConcurrency:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 10
    Description: Lambda wallet provisionnée (0 = ping seul ; quota compte AWS)

  AdminEmail:
    Type: String
    Default: ""
    Description: >-
      Email(s) des fondateurs, séparés par des virgules : chacun peut se connecter et reçoit
      toutes les alertes (secours si l'un est indisponible). Vide = tableau de bord désactivé (503).

  AdminAlarmEmail2:
    Type: String
    Default: ""
    Description: Second email (optionnel) abonné aux alarmes techniques SNS.

  AdminSenderEmail:
    Type: String
    Default: ""
    Description: Expéditeur SES vérifié (alertes, récaps). Vide = pas d'email.

  AdminPasswordHash:
    Type: String
    NoEcho: true
    Default: ""
    Description: Empreinte scrypt du mot de passe admin (node aws/scripts/admin-setup.mjs)

  AdminTotpSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Secret TOTP base32 (application d'authentification)

  AdminJwtSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: Secret de session admin (32+ caractères, distinct de JwtSecret)

  AdminDeviceKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Clé des téléphones admin (empreinte ou code du téléphone). Vide = désactivé.

  AdminPushPhone:
    Type: String
    Default: ""
    Description: Téléphones Blyp des fondateurs (9 chiffres, séparés par des virgules) — reçoivent tous les push

  AdminAllowedIps:
    Type: String
    Default: ""
    Description: Liste d'IP autorisées séparées par des virgules (vide = toutes, protégées par mot de passe + TOTP)

Conditions:
  HasAdminEmail: !Not [!Equals [!Ref AdminEmail, ""]]
  HasAdminAlarmEmail2: !And [!Condition HasAdminEmail, !Not [!Equals [!Ref AdminAlarmEmail2, ""]]]
  IsProd: !Equals [!Ref Stage, prod]
  HasPinPepper: !Not [!Equals [!Ref TransactionPinPepper, ""]]
  HasWalletPC: !Not [!Equals [!Ref WalletProvisionedConcurrency, 0]]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    Tags:
      Project: BlypPay
      Environment: !Ref Stage
    Environment:
      Variables:
        STAGE: !Ref Stage
        TABLE_NAME: !Ref BlypTable
        JWT_SECRET: !Ref JwtSecret
        OTP_PEPPER: !Ref OtpPepper
        ADMIN_EVENTS_QUEUE_URL: !Ref AdminEventsQueue
        NODE_ENV: !If [IsProd, production, development]

Resources:
  BlypApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - X-Request-Id

  BlypTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "blyp-${Stage}"
      BillingMode: PAY_PER_REQUEST
      WarmThroughput:
        ReadUnitsPerSecond: 12000
        WriteUnitsPerSecond: 4000
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: BlypPay
        - Key: Environment
          Value: !Ref Stage

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-health-${Stage}"
      Description: GET /health — vérifie Lambda + DynamoDB
      CodeUri: ../aws/
      Handler: handlers/health/index.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BlypTable
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /health
            Method: GET

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-auth-${Stage}"
      Description: Auth OTP, JWT, onboarding, GET /me
      CodeUri: ../aws/
      Handler: handlers/auth/index.handler
      Timeout: 15
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          # Access JWT court ; session longue via refresh 180 j (DynamoDB)
          JWT_ACCESS_EXPIRY: "1h"
          OTP_PEPPER: !Ref OtpPepper
          TRANSACTION_PIN_PEPPER: !If
            - HasPinPepper
            - !Ref TransactionPinPepper
            - !Ref OtpPepper
          SMS_PROVIDER: !Ref SmsProvider
          OBIT_SMS_KEY_API: !Ref ObitSmsKeyApi
          OBIT_SMS_SENDER: !Ref ObitSmsSender
          WHATSAPP_CLOUD_TOKEN: !Ref WhatsappCloudToken
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsappPhoneNumberId
          WHATSAPP_OTP_TEMPLATE_NAME: !Ref WhatsappOtpTemplateName
          WHATSAPP_OTP_TEMPLATE_LANG: !Ref WhatsappOtpTemplateLang
          ANDROID_SMS_OTP_APP_HASH: !Ref AndroidSmsOtpAppHash
          ASSETS_BUCKET: !Sub "blyp-assets-${Stage}-${AWS::AccountId}"
          ASSETS_CDN_URL: !Sub "https://${AssetsDistribution.DomainName}"
          MEDIA_BUCKET: !Sub "blyp-media-${Stage}-${AWS::AccountId}"
          KYC_AUTO_APPROVE: !Ref Stage
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AdminEventsQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - S3CrudPolicy:
            BucketName: !Sub "blyp-assets-${Stage}-${AWS::AccountId}"
        - S3CrudPolicy:
            BucketName: !Sub "blyp-media-${Stage}-${AWS::AccountId}"
      Events:
        RequestOtp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/request-otp
            Method: POST
        VerifyOtp:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/verify-otp
            Method: POST
        RefreshSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/refresh
            Method: POST
        SetPin:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/onboarding/transaction-pin
            Method: POST
        SetProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/onboarding/profile
            Method: POST
        CancelRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/registration
            Method: DELETE
        EnableMerchant:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /auth/merchant/enable
            Method: POST
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me
            Method: GET
        MeAvatarPresign:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/avatar/presign
            Method: POST
        MeAvatarConfirm:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/avatar/confirm
            Method: POST
        KycPresign:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /kyc/presign
            Method: POST
        KycSubmit:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /kyc/submit
            Method: POST
        VaultList:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /vault/documents
            Method: GET
        VaultPresign:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /vault/documents/presign
            Method: POST
        VaultCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /vault/documents
            Method: POST
        VaultDocGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /vault/documents/{id}
            Method: GET
        VaultDocDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /vault/documents/{id}
            Method: DELETE
        MeContext:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/context
            Method: PUT
        MeProfilePut:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/profile
            Method: PUT
        MeTransactionPinVerify:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/transaction-pin/verify
            Method: POST
        MeTransactionPinChange:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/transaction-pin/change
            Method: POST
        MeSmallPayWithoutPin:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/small-pay-without-pin
            Method: PUT
        MeDeviceTokenPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/device-token
            Method: PUT
        MeDeviceTokenDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /me/device-token
            Method: DELETE
        CommercesCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces
            Method: POST
        CommercesList:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces
            Method: GET
        CommercePatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces/{commerceId}
            Method: PATCH
        AccountPublic:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /accounts/{accountId}/public
            Method: GET
        AccountSoaTrip:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /accounts/{accountId}/soa-trip
            Method: GET
        CommerceSoaTripGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces/{commerceId}/soa-trip
            Method: GET
        CommerceSoaTripReset:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces/{commerceId}/soa-trip
            Method: POST
        CommerceSoaDayReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces/{commerceId}/soa-trip/day-report
            Method: GET
        CommercePaymentReceiptEncash:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces/{commerceId}/payment-receipts/encash
            Method: POST
        CommercePaymentReceiptEncashList:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /commerces/{commerceId}/payment-receipts/encashments
            Method: GET

  PayReceiptEd25519Secret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "blyp/${Stage}/pay-receipt-ed25519-private-key-pem"
      Description: Ed25519 PEM — signature reçus paiement commerce (v2)

  WalletFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-wallet-${Stage}"
      Description: Wallet dépôts, paiements, historique
      CodeUri: ../aws/
      Handler: handlers/wallet/index.handler
      Timeout: 20
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig: !If
        - HasWalletPC
        - ProvisionedConcurrentExecutions: !Ref WalletProvisionedConcurrency
        - !Ref AWS::NoValue
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          OTP_PEPPER: !Ref OtpPepper
          TRANSACTION_PIN_PEPPER: !If
            - HasPinPepper
            - !Ref TransactionPinPepper
            - !Ref OtpPepper
          PAY_RECEIPT_PEPPER: !Ref OtpPepper
          PAY_RECEIPT_ED25519_SECRET_ARN: !Ref PayReceiptEd25519Secret
          DEPOSIT_MODE: !Ref DepositMode
          PAWAPAY_API_TOKEN: !Ref PawapayApiToken
          PAWAPAY_API_BASE_URL: !Ref PawapayApiBaseUrl
          PAWAPAY_DEPOSIT_CURRENCY: XAF
          PUSH_QUEUE_URL: !Ref PushQueue
          REALTIME_WS_API_ENDPOINT: !Sub "https://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref PayReceiptEd25519Secret
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PushQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AdminEventsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/${Stage}/POST/@connections/*"
      Events:
        WalletMoneyRequests:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /wallet/money-requests
            Method: POST
        WalletMoneyRequestsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /wallet/money-requests
            Method: GET
        WalletDeposit:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /wallet/deposit
            Method: POST
        WalletDepositStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /wallet/deposits/{id}
            Method: GET
        PaymentPay:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /payments/pay
            Method: POST
        Transactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /transactions
            Method: GET
        PocketsList:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /pockets
            Method: GET
        PocketsCreate:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /pockets
            Method: POST
        PocketRename:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /pockets/{id}
            Method: PUT
        PocketDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /pockets/{id}
            Method: DELETE
        PocketMove:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /pockets/{id}/move
            Method: POST
        PocketTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /pockets/{id}/transactions
            Method: GET

  WalletWarmSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Lambda wallet + lecture Dynamo toutes les 1 min
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: WalletWarmTarget
          Arn: !Sub "${WalletFunction.Arn}:live"
          Input: '{"warm":true}'

  WalletWarmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Sub "${WalletFunction.Arn}:live"
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WalletWarmSchedule.Arn

  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-webhook-${Stage}"
      Description: Webhooks PawaPay (dépôts async)
      CodeUri: ../aws/
      Handler: handlers/webhook/index.handler
      Timeout: 15
      Environment:
        Variables:
          DEPOSIT_MODE: !Ref DepositMode
          PAWAPAY_API_TOKEN: !Ref PawapayApiToken
          PAWAPAY_API_BASE_URL: !Ref PawapayApiBaseUrl
          PAWAPAY_WEBHOOK_SECRET: !Ref PawapayWebhookSecret
          PAWAPAY_WEBHOOK_VERIFY: none
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AdminEventsQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
      Events:
        PawapayDeposit:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /webhooks/pawapay/deposit
            Method: POST

  PushQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "blyp-push-dlq-${Stage}"
      MessageRetentionPeriod: 1209600

  PushQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "blyp-push-${Stage}"
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PushQueueDLQ.Arn
        maxReceiveCount: 3

  PushWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-push-${Stage}"
      Description: Worker SQS — push Expo (paiement reçu)
      CodeUri: ../aws/
      Handler: handlers/push/index.handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
      Events:
        PushQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt PushQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # Seau blyp-media-{Stage}-{AccountId} : déjà provisionné (vocaux / images). Pas de ressource
  # S3 ici — EarlyValidation échoue si le nom existe déjà hors stack.

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "blyp-assets-${Stage}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AssetsOAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub "blyp-assets-${Stage}"

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt AssetsOAI.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub "${AssetsBucket.Arn}/*"

  AssetsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: assetsS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: true
          Compress: true
        Origins:
          - Id: assetsS3
            DomainName: !GetAtt AssetsBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${AssetsOAI}"
        PriceClass: PriceClass_100

  MessagingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-messaging-${Stage}"
      Description: Message Money V1 — conversations, messages, escrow claim
      CodeUri: ../aws/
      Handler: handlers/messaging/index.handler
      Timeout: 15
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          OTP_PEPPER: !Ref OtpPepper
          TRANSACTION_PIN_PEPPER: !If
            - HasPinPepper
            - !Ref TransactionPinPepper
            - !Ref OtpPepper
          PUSH_QUEUE_URL: !Ref PushQueue
          SMS_PROVIDER: !Ref SmsProvider
          OBIT_SMS_KEY_API: !Ref ObitSmsKeyApi
          OBIT_SMS_SENDER: !Ref ObitSmsSender
          WHATSAPP_CLOUD_TOKEN: !Ref WhatsappCloudToken
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsappPhoneNumberId
          BLYP_INVITE_URL: !Ref BlypInviteUrl
          MEDIA_BUCKET: !Sub "blyp-media-${Stage}-${AWS::AccountId}"
          TRANSLATE_REGION: eu-west-1
          REALTIME_WS_API_ENDPOINT: !Sub "https://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PushQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AdminEventsQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Sub "blyp-media-${Stage}-${AWS::AccountId}"
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
                - comprehend:DetectDominantLanguage
              Resource: "*"
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/${Stage}/POST/@connections/*"
      Events:
        ListConversations:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /conversations
            Method: GET
        OpenConversation:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /conversations
            Method: POST
        ContactsBlypLookup:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /contacts/blyp-lookup
            Method: POST
        ListMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /conversations/{id}/messages
            Method: GET
        SendMessage:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /conversations/{id}/messages
            Method: POST
        TranslateMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /conversations/{id}/translate
            Method: POST
        ClaimMoney:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /money-transfers/{id}/claim
            Method: POST
        PatchMoneyReceiptRequired:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /money-transfers/{id}/receipt-required
            Method: PATCH
        StatusFeed:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/feed
            Method: GET
        StatusUploadPresign:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/upload-presign
            Method: POST
        StatusPublish:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/posts
            Method: POST
        StatusView:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/posts/{id}/view
            Method: POST
        StatusViewers:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/posts/{id}/viewers
            Method: GET
        StatusDeleteMine:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/me
            Method: DELETE
        StatusDeletePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/posts/{id}
            Method: DELETE
        StatusUpdatePost:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /status/posts/{id}
            Method: PATCH

  RealtimeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "blyp-realtime-${Stage}"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  RealtimeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref RealtimeApi
      StageName: !Ref Stage
      AutoDeploy: true

  RealtimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-realtime-${Stage}"
      Description: WebSocket messagerie — présence, frappe (style WhatsApp)
      CodeUri: ../aws/
      Handler: handlers/realtime/index.handler
      Timeout: 10
      Environment:
        Variables:
          JWT_SECRET: !Ref JwtSecret
          TABLE_NAME: !Ref BlypTable
          PUSH_QUEUE_URL: !Ref PushQueue
          OTP_PEPPER: !Ref OtpPepper
          TRANSACTION_PIN_PEPPER: !If
            - HasPinPepper
            - !Ref TransactionPinPepper
            - !Ref OtpPepper
          REALTIME_WS_API_ENDPOINT: !Sub "https://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt PushQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/${Stage}/POST/@connections/*"

  RealtimeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref RealtimeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RealtimeFunction.Arn}/invocations"

  RealtimeConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RealtimeApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join
        - /
        - - integrations
          - !Ref RealtimeIntegration

  RealtimeDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RealtimeApi
      RouteKey: $disconnect
      Target: !Join
        - /
        - - integrations
          - !Ref RealtimeIntegration

  RealtimeDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref RealtimeApi
      RouteKey: $default
      Target: !Join
        - /
        - - integrations
          - !Ref RealtimeIntegration

  RealtimeConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RealtimeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/*"

  # ---------------------------------------------------------------------------
  # Tableau de bord fondateur : journal d'événements, alertes, récaps, site /admin
  # (voir docs/ADMIN-DASHBOARD.md)
  # ---------------------------------------------------------------------------

  AdminEventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "blyp-admin-events-dlq-${Stage}"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AdminEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "blyp-admin-events-${Stage}"
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AdminEventsDLQ.Arn
        maxReceiveCount: 5

  AdminEventsWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-admin-events-${Stage}"
      Description: Worker SQS — journal d'événements, statistiques, alertes fondateur
      CodeUri: ../aws/
      Handler: handlers/adminEvents/index.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_SENDER_EMAIL: !Ref AdminSenderEmail
          ADMIN_PASSWORD_HASH: !Ref AdminPasswordHash
          ADMIN_TOTP_SECRET: !Ref AdminTotpSecret
          ADMIN_JWT_SECRET: !Ref AdminJwtSecret
          ADMIN_PUSH_PHONE: !Ref AdminPushPhone
          ADMIN_ALLOWED_IPS: !Ref AdminAllowedIps
          ADMIN_DASHBOARD_URL: !Sub "https://${BlypApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/admin"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        AdminEventsQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AdminEventsQueue.Arn
            BatchSize: 10
            ScalingConfig:
              MaximumConcurrency: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-admin-${Stage}"
      Description: Site + API du tableau de bord fondateur (/admin)
      CodeUri: ../aws/
      Handler: handlers/admin/index.handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_SENDER_EMAIL: !Ref AdminSenderEmail
          ADMIN_PASSWORD_HASH: !Ref AdminPasswordHash
          ADMIN_TOTP_SECRET: !Ref AdminTotpSecret
          ADMIN_JWT_SECRET: !Ref AdminJwtSecret
          ADMIN_DEVICE_KEY: !Ref AdminDeviceKey
          ADMIN_PUSH_PHONE: !Ref AdminPushPhone
          ADMIN_ALLOWED_IPS: !Ref AdminAllowedIps
          REALTIME_WS_API_ENDPOINT: !Sub "https://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AdminEventsQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RealtimeApi}/${Stage}/POST/@connections/*"
      Events:
        AdminPage:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /admin
            Method: GET
        AdminProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref BlypApi
            Path: /admin/{proxy+}
            Method: ANY

  AdminRecapFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "blyp-admin-recap-${Stage}"
      Description: Récaps fondateur — quotidien (07:00 Cameroun), hebdo le lundi, mensuel le 1er
      CodeUri: ../aws/
      Handler: handlers/adminRecap/index.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_SENDER_EMAIL: !Ref AdminSenderEmail
          ADMIN_PASSWORD_HASH: !Ref AdminPasswordHash
          ADMIN_TOTP_SECRET: !Ref AdminTotpSecret
          ADMIN_JWT_SECRET: !Ref AdminJwtSecret
          ADMIN_PUSH_PHONE: !Ref AdminPushPhone
          ADMIN_ALLOWED_IPS: !Ref AdminAllowedIps
          ADMIN_DASHBOARD_URL: !Sub "https://${BlypApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/admin"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BlypTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: "*"
      Events:
        DailyAt7Douala:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 7 * * ? *)
            ScheduleExpressionTimezone: Africa/Douala
            State: ENABLED
            Input: '{}'

  AdminAlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAdminEmail
    Properties:
      TopicName: !Sub "blyp-admin-alarms-${Stage}"
      Subscription:
        - Protocol: email
          Endpoint: !Select [0, !Split [",", !Ref AdminEmail]]

  AdminAlarmSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasAdminAlarmEmail2
    Properties:
      TopicArn: !Ref AdminAlarmTopic
      Protocol: email
      Endpoint: !Ref AdminAlarmEmail2

  AdminDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAdminEmail
    Properties:
      AlarmName: !Sub "blyp-admin-events-dlq-${Stage}"
      AlarmDescription: Des événements admin n'ont pas pu être traités (file morte non vide)
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt AdminEventsDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlarmTopic

  AdminWorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAdminEmail
    Properties:
      AlarmName: !Sub "blyp-admin-worker-errors-${Stage}"
      AlarmDescription: Erreurs du worker d'événements admin
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AdminEventsWorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminAlarmTopic

Outputs:
  ApiUrl:
    Description: URL de base de l'API (EXPO_PUBLIC_API_URL)
    Value: !Sub "https://${BlypApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "blyp-api-url-${Stage}"

  AssetsCdnUrl:
    Description: EXPO_PUBLIC_ASSETS_CDN_URL (photos de profil avatars/*.jpg)
    Value: !Sub "https://${AssetsDistribution.DomainName}"
    Export:
      Name: !Sub "blyp-assets-cdn-${Stage}"

  PawapayWebhookUrl:
    Description: URL callback à enregistrer chez PawaPay (dépôts async)
    Value: !Sub "https://${BlypApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/webhooks/pawapay/deposit"

  TableName:
    Description: Table DynamoDB single-table
    Value: !Ref BlypTable
    Export:
      Name: !Sub "blyp-table-name-${Stage}"

  HealthFunctionArn:
    Description: ARN de la Lambda health
    Value: !GetAtt HealthFunction.Arn

  AuthFunctionArn:
    Description: ARN de la Lambda auth
    Value: !GetAtt AuthFunction.Arn

  WalletFunctionArn:
    Description: ARN de la Lambda wallet
    Value: !GetAtt WalletFunction.Arn

  PayReceiptEd25519SecretArn:
    Description: Secrets Manager — clé privée Ed25519 reçus commerce (PEM)
    Value: !Ref PayReceiptEd25519Secret

  WebhookFunctionArn:
    Description: ARN de la Lambda webhooks
    Value: !GetAtt WebhookFunction.Arn

  AdminDashboardUrl:
    Description: Tableau de bord fondateur (mot de passe + code TOTP)
    Value: !Sub "https://${BlypApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/admin"

  AdminEventsQueueUrl:
    Description: File SQS du journal d'événements admin
    Value: !Ref AdminEventsQueue

  PushQueueUrl:
    Description: File SQS push notifications
    Value: !Ref PushQueue

  PushWorkerFunctionArn:
    Description: ARN du worker push
    Value: !GetAtt PushWorkerFunction.Arn

  MessagingFunctionArn:
    Description: ARN de la Lambda messaging
    Value: !GetAtt MessagingFunction.Arn

  RealtimeWsUrl:
    Description: EXPO_PUBLIC_REALTIME_WS_URL (wss — messagerie temps réel)
    Value: !Sub "wss://${RealtimeApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "blyp-realtime-ws-url-${Stage}"
