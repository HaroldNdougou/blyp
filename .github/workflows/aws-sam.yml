name: AWS SAM

on:
  push:
    branches: [main, master]
    paths:
      - "infra/**"
      - "aws/**"
      - ".github/workflows/aws-sam.yml"
  pull_request:
    paths:
      - "infra/**"
      - "aws/**"
      - ".github/workflows/aws-sam.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aws/package-lock.json

      - name: Install Lambda dependencies
        working-directory: aws
        run: npm ci

      - uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --lint --template infra/template.yaml

      - name: Build SAM artifacts
        run: sam build --template infra/template.yaml
